name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only one Pages deploy at a time; newer pushes cancel older in-flight runs.
# This prevents the "in progress deployment" 400 error from the legacy pipeline.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage site
        # Copy only what should be published — keep .github/ prompts private.
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -R assets _site/
          [ -f README.md ] && cp README.md _site/ || true
          ls -la _site

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
